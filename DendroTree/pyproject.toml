[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dendrotree"
version = "0.1.0"
description = ""
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "networkx",
  "scikit-image",
  "scipy",
  "skan",
  "rustworkx",
  "matplotlib",
  "tqdm",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
